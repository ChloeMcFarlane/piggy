{% extends 'tracker/base.html' %}
{% load static %}
{% load humanize %}

{% block head_title %}Transactions List{% endblock %}
{% block container_class %}p-4{% endblock %}

{% block content %}
<div class="flex justify-start items-center">
        <!-- REMEMBER TO KEEP THE ORIGINAL COPYRIGHT NOTICE  -->
    <h1 class="header">Transactions</h1> 

    <a 
    hx-get="{% url 'create-transaction' %}"
    hx-push-url="true"
    hx-target="#transaction-block"
    class="add-btn cursor-pointer" 
    aria-label="Add transaction" 
    title="Add transaction">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
    </a>
</div>

<div id="transaction-block">
    {% include 'tracker/partials/transactions-container.html' %}
</div>

{% endblock %}
