{% extends "tracker/base.html" %}
{% load static %}
{% block head_title %}Transaction Added{% endblock %}

{% block content %}

<link href="{% static 'css/success_error_assets.css' %}" rel="stylesheet">

<div class="success-wrapper">
    <div role="alert" class="salert alert-success alert-soft">
        <span>{{ message }}</span>
    </div>

    <div class="btn-wrapper-success">
        <a href="{% url 'create-transaction' %}" id="add-another" class="btn btn-success">
            Add Another
        </a>
        <a href="{% url 'transactions-list' %}" id="view-all" class="btn btn-view-all">
            View All Transactions
        </a>
    </div>
</div>


{% endblock %}
