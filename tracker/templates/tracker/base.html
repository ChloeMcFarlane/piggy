{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block head_title %}
            Personal Finance Tracker
        {% endblock %}
    </title>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

    <!-- CSS: output.css first -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Erica+One&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- COOKIES / TIMEZONE DETECTION -->
    <script>
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (tz && !document.cookie.includes('django_timezone=' + tz)) {
          document.cookie = 'django_timezone=' + tz + '; path=/; max-age=31536000; SameSite=Lax';
        }
    </script>

    {% block extra_head %}
    {% endblock %}
</head>
<body hx-headers=' {"X-CSRFToken": "{{ csrf_token }}"}'>

    {% include 'tracker/partials/navbar.html' %}

    <div class="max-w-screen-lg mx-auto p-4">

        {# TEMPORARY TEST BLOCK: delete this once you've checked the colors #}

        <!--  -->
        <!-- <div class="flex gap-2 mb-4">
            <button class="btn btn-primary">+ Income</button>
            <button class="btn btn-secondary">− Expense</button>
            <span class="badge badge-success">+ Income</span>
            <span class="badge badge-error">− Expense</span>
        </div> -->

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
